services:
  postgres:
    image: postgres:16-alpine
    container_name: projecthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: projecthub
      POSTGRES_PASSWORD: projecthub
      POSTGRES_DB: projecthub
    ports:
      - "5432:5432"
    volumes:
      - projecthub_pgdata:/var/lib/postgresql/data
volumes:
  projecthub_pgdata:
